[target]
id = "android-host-arm64"
display_name = "Android Hosted Runtime (Samsung Galaxy S25 / arm64-v8a)"
architecture = "aarch64"
target_triple = "aarch64-linux-android"
image_format = "apk"
output_dir = "out/android-host-arm64"
flashing_allowed = false

[jni]
library_name = "libandroid_host.so"
abi = "arm64-v8a"
protocol_version = 1
min_sdk = 29
target_sdk = 35

[storage]
data_dir = "/data/data/org.onuron.mobile"
