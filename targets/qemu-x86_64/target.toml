[target]
id = "qemu-x86_64"
display_name = "QEMU x86_64 Virtual Reference"
architecture = "x86_64"
target_triple = "x86_64-unknown-linux-musl"
image_format = "initramfs"
output_dir = "out/qemu-x86_64"
flashing_allowed = false

[kernel]
name = "vmlinuz-virt"
url = "https://dl-cdn.alpinelinux.org/alpine/v3.19/releases/x86_64/netboot/vmlinuz-virt"
sha256 = "ea2e787d9d87de78162575567ac8f685d79fbeece88d38024be6816a341c4f7a"
bootargs = "console=ttyS0 root=/dev/ram0 panic=1 quiet"

[qemu]
machine = "q35"
cpu = "max"
memory_mb = 1024
serial = "stdio"
display = "none"

[storage]
primary_disk = "data.img"
filesystem = "ext4"
mount_point = "/data"
