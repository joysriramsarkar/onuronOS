[target]
id = "qemu-aarch64"
display_name = "QEMU ARM64 (AArch64) Virtual Reference"
architecture = "aarch64"
target_triple = "aarch64-unknown-linux-musl"
image_format = "initramfs"
output_dir = "out/qemu-aarch64"
flashing_allowed = false

[kernel]
name = "vmlinuz-lts"
url = "https://dl-cdn.alpinelinux.org/alpine/v3.19/releases/aarch64/netboot/vmlinuz-lts"
sha256 = "014887a8047739213ce21090349c71f75c7edc0133efa03c840a2db8a354f9e1"
bootargs = "console=ttyAMA0 earlycon root=/dev/ram0 panic=1 quiet"

[qemu]
machine = "virt"
cpu = "cortex-a72"
memory_mb = 1024
serial = "stdio"
display = "none"

[storage]
primary_disk = "data.img"
filesystem = "ext4"
mount_point = "/data"
