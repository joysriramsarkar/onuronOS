# Maturity table data file.
#
# This is the source of truth for the "Subsystem Maturity & Reality" table in
# README.md. Regenerate the table with:
#
#     python build/gen-maturity.py
#
# and verify it is up to date (CI) with:
#
#     python build/gen-maturity.py --check
#
# Schema (one [[entries]] table per subsystem):
#   name        Display name (may contain Markdown).
#   tier        One of: production, functional-prototype, experimental,
#               stub, not-implemented. Maps to the README legend emoji.
#   details     "Details & Reality" cell text.
#   evidence    Repo-relative paths that justify the claim. Every path must
#               exist; a missing path fails the generator.
#   simulated   true when the subsystem's user-facing screen shows fabricated
#               data. Such rows get a visible [SIMULATED] marker.
#   ui_screens  Screen keys from shell/src/simulated.rs that back the
#               `simulated` claim. Must match the Rust registry in both
#               directions (no orphan screens, no phantom claims).
#
# Tier honesty note: 🟢 production means "hardened and verified in real
# environments". Nothing here has passed that bar yet (the Linux CI/QEMU gate
# is still unproven and no physical target boots), so no row is 🟢.

