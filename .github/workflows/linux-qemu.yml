name: Linux build, tests and QEMU boot smoke test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools qemu-system-x86 python3 e2fsprogs squashfs-tools
      - name: Workspace tests
        run: cargo test --workspace --all-targets
      - name: Build & harness unit tests
        run: python3 -m unittest discover -s build -p "test_*.py"
      - name: Workspace lint
        run: cargo clippy --workspace --all-targets -- -W clippy::all
      - name: Build Linux musl binaries
        run: cargo build --release --workspace --target x86_64-unknown-linux-musl
      - name: Package initramfs (fetch Linux kernel)
        run: python3 build/mkinitramfs.py
      - name: Verify image reproducibility
        run: python3 build/check-reproducible.py
      - name: Persistent-data validation harness
        run: python3 build/persistent-data-test.py
      - name: QEMU boot smoke test
        timeout-minutes: 3
        run: python3 build/qemu-smoke.py
      - name: QEMU end-to-end reboot persistence test
        timeout-minutes: 3
        run: python3 build/qemu-persistence-test.py

  aarch64-qemu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu qemu-system-arm python3 e2fsprogs squashfs-tools
      - name: Configure cross-linker
        run: |
          mkdir -p .cargo
          cat << 'EOF' >> .cargo/config.toml
          [target.aarch64-unknown-linux-musl]
          linker = "aarch64-linux-gnu-gcc"
          EOF
      - name: Build ARM64 musl binaries
        run: cargo build --release --workspace --target aarch64-unknown-linux-musl
      - name: Package ARM64 initramfs & verify kernel checksum
        run: python3 build/mkinitramfs.py --target qemu-aarch64
      - name: Format persistent ext4 data disk
        run: python3 build/mkdisk.py --target qemu-aarch64 --size-mb 512
      - name: QEMU ARM64 boot smoke test
        timeout-minutes: 3
        run: python3 build/qemu-smoke.py --target qemu-aarch64
      - name: QEMU ARM64 end-to-end reboot persistence test
        timeout-minutes: 3
        run: python3 build/qemu-persistence-test.py --target qemu-aarch64
      - name: Upload ARM64 build manifest artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aarch64-qemu-manifest
          path: |
            out/qemu-aarch64/manifest.json
            out/qemu-aarch64/checksums.txt


