name: NilOS Security Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run weekly security audits every Monday at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  security-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Cargo Audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Dependency policy gate (see deny.toml).
      # cargo-deny hard-fails on a known vulnerability, a yanked crate, or any
      # unmaintained crate that is not explicitly listed in deny.toml with a
      # reason. A new unmaintained crate therefore forces a review instead of
      # passing silently.
      - name: Check advisories & unmaintained dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

      # Separate issue-creation step with explicit permissions.
      # Previously audit-check tried to create issues but failed with
      # "Resource not accessible by integration" because the workflow
      # only had checks:write + contents:read.
      - name: Create security issue (if audit failed)
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security-audit'
            });
            const title = `Security audit failed: ${context.sha.substring(0, 7)}`;
            const existing = issues.find(i => i.title === title);
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: 'Security audit workflow failed. Check the [workflow run](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ') for details.',
                labels: ['security-audit']
              });
            }
