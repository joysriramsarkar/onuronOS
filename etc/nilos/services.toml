# etc/nilos/services.toml — OnuronOS Core Service Topology (Schema Version 1)
#
# Canonical inventory of system daemons supervised by nilinit (PID 1).
# Complies with Roadmap Section 34.1: versioned schema, distinct responsibilities,
# socket activation paths, and restart policies.

version = 1

[[services]]
name = "nild"
exec = "/usr/bin/nild"
restart = "always"

[[services]]
name = "nilkeyd"
exec = "/usr/bin/nilkeyd"
restart = "always"

[[services]]
name = "nilbus"
exec = "/usr/bin/nilbus"
restart = "always"

[[services]]
name = "netd"
exec = "/usr/bin/netd"
restart = "always"

[[services]]
name = "audiod"
exec = "/usr/bin/audiod"
restart = "always"

[[services]]
name = "powerd"
exec = "/usr/bin/powerd"
restart = "always"

[[services]]
name = "nilshell"
exec = "/usr/bin/nilshell"
restart = "always"

[[services]]
name = "inputd"
exec = "/usr/bin/inputd"
restart = "always"
socket_activation = "/run/nilos/input.sock"

[[services]]
name = "telephonyd"
exec = "/usr/bin/telephonyd"
restart = "always"
socket_activation = "/run/nilos/telephony.sock"

[[services]]
name = "camerad"
exec = "/usr/bin/camerad"
restart = "always"
socket_activation = "/run/nilos/camera.sock"

[[services]]
name = "btd"
exec = "/usr/bin/btd"
restart = "always"
socket_activation = "/run/nilos/bt.sock"

[[services]]
name = "nilupd"
exec = "/usr/bin/nilupd"
restart = "always"
socket_activation = "/run/nilos/update.sock"

[[services]]
name = "thermald"
exec = "/usr/bin/thermald"
restart = "always"

[[services]]
name = "nilwdt"
exec = "/usr/bin/nilwdt"
restart = "always"

[[services]]
name = "notifyd"
exec = "/usr/bin/notifyd"
socket_activation = "/run/nilos/notify.sock"

[[services]]
name = "nilimed"
exec = "/usr/bin/nilimed"
socket_activation = "/run/nilos/ime.sock"

[[services]]
name = "nilttsd"
exec = "/usr/bin/nilttsd"
socket_activation = "/run/nilos/tts.sock"

[[services]]
name = "nilandroidd"
exec = "/usr/bin/nilandroidd"
socket_activation = "/run/nilos/android.sock"
