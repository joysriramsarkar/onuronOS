[package]
name = "nillang"
version = "0.1.0"
edition = "2021"
description = "NilLang compiler, parser and execution engine for OnuronOS native apps"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "nilc"
path = "src/main.rs"

[lib]
name = "nillang"
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3.10"
hex = "0.4"
nilpkg = { path = "../../pkg/nilpkg" }
nilrt = { path = "../nilrt" }
