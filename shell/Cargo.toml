[package]
name = "nilshell"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
rand = "0.8"
nilpkg = { path = "../pkg/nilpkg" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nilsd = { path = "../runtime/nilsd" }
nilcam = { path = "../runtime/nilcam" }
nilaudio = { path = "../runtime/nilaudio" }
nilnotify = { path = "../runtime/nilnotify" }
nilbus-client = { path = "../runtime/nilbus-client" }
nilprotocol = { path = "../protocol" }
nilandroid-client = { path = "../runtime/nilandroid-client" }
nilpower = { path = "../runtime/nilpower" }
nilnet = { path = "../runtime/nilnet" }
ureq = { version = "2", features = ["tls"] }
